<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demos</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f4f4f5;
      background: #09090b;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(120, 120, 255, 0.16), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(255, 120, 180, 0.11), transparent 30rem),
        #09090b;
    }

    main {
      width: min(680px, 100%);
      background: #18181b;
      border: 1px solid #2f2f35;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 6vw, 3.25rem);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    nav {
      display: grid;
      gap: 12px;
    }

    a {
      display: block;
      padding: 16px 18px;
      border: 1px solid #34343b;
      border-radius: 14px;
      color: #f4f4f5;
      text-decoration: none;
      font-size: 1.1rem;
      background: #222228;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
    }

    a:hover,
    a:focus-visible {
      transform: translateY(-1px);
      background: #2d2d35;
      border-color: #52525b;
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Demos</h1>

    <nav aria-label="Demo pages">
      <a href="/EmDM/emergent_harm.html">Emergent Harm</a>
      <a href="/EmDM/flock.html">Flock</a>
      <a href="/EmDM/percolation.html">Percolation</a>
      <a href="/EmDM/rhythm_to_pitch.html">Rhythm to Pitch</a>
      <a href="/EmDM/sigmoid_demo.html">Sigmoid Demo</a>
    </nav>
  </main>
</body>
</html>
