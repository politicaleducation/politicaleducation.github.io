<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ICE — Timeline + Metrics</title>
  <style>
    :root{
      --bg:#0b0c10;
      --panel:#12141c;
      --panel2:#0f1118;
      --text:#e7e7ea;
      --muted:#c7cad6;
      --stroke:#222636;
      --accent:#6ee7ff;
      --radius:14px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background:linear-gradient(180deg,var(--bg),#07070b);
      color:var(--text);
    }
    header{
      position:sticky; top:0; z-index:50;
      backdrop-filter:saturate(130%) blur(10px);
      background:rgba(11,12,16,.72);
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .wrap{max-width:1440px; margin:0 auto; padding:8px 12px;}
    .top{display:flex; align-items:center; justify-content:space-between; gap:12px;}
    h1{font-size:13px; margin:0; font-weight:650; letter-spacing:.2px;}
    .tiny{color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .pillrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}

    .mainTop{margin:6px 0 8px; justify-content:flex-start;}

    .legend{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
    .legendBelow{margin:10px 0 6px; justify-content:flex-start;}
    .legendItem{display:flex; gap:6px; align-items:center;}
    .swatch{width:10px; height:10px; border-radius:3px; border:1px solid rgba(255,255,255,.18);}
    .legendLabel{font-size:11px; color:var(--muted); white-space:nowrap;}
    .pill{
      border:1px solid rgba(255,255,255,.08);
      background:rgba(18,20,28,.75);
      padding:6px 10px;
      border-radius:999px;
      color:var(--muted);
      cursor:pointer;
      user-select:none;
    }
    .pill:hover{border-color:rgba(255,255,255,.16); color:var(--text)}
    .pill.active{border-color:rgba(110,231,255,.55); color:var(--text)}
    .timeline-wrap{
      margin-top:10px;
    }

    .readoutRow{
      margin-top:10px;
      display:flex;
      justify-content:center;
      align-items:stretch;
      gap:12px;
      flex-wrap:wrap;
    }
    .playDock{
      display:flex;
      align-items:stretch;
    }
    .timelineHead{
      display:flex;
      justify-content:center;
      align-items:center;
      margin-bottom:10px;
    }
    .transport{
      display:flex;
      height:100%;
      justify-content:center;
      gap:8px;
      align-items:center;
      padding:4px;
      border-radius:999px;
      background:rgba(18,20,28,.35);
      border:1px solid rgba(255,255,255,.10);
      opacity:.92;
      transition:opacity .15s ease;
    }
    .tlabel{
      font-size:11px;
      letter-spacing:.12em;
      color:rgba(231,231,234,0.78);
      padding:0 10px 0 12px;
      user-select:none;
    }
    .transport.playing{
      opacity:1;
      border-color:rgba(110,231,255,0.22);
      background:rgba(18,20,28,.50);
    }
    .transport.playing #tPlay{
      border-color:rgba(110,231,255,0.38);
    }
    .timeline-wrap:hover .transport{opacity:1}
                .tbtn{
      width:36px;
      height:36px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(18,20,28,.58);
      color:rgba(231,231,234,.96);
      cursor:pointer;
      pointer-events:auto;
      display:grid;
      place-items:center;
      padding:0;
      line-height:1;
      font-size:16px;
    }
    .tbtn:hover{border-color:rgba(255,255,255,.20)}
    .tbtn:active{transform:translateY(1px)}
    .timeline{
      margin-top:0px;
      display:flex;
      gap:8px;
      overflow:auto;
      scroll-snap-type:x mandatory;
      padding:0 var(--tSide, 0px) 6px;
      scrollbar-width:none;
      -ms-overflow-style:none;
    }
    .timeline::-webkit-scrollbar{display:none;}
    .checkpoint{
      min-width:320px;
      max-width:420px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(18,20,28,.55);
      border-radius:var(--radius);
      padding:6px 10px 6px;
      cursor:pointer;
      position:relative;
      overflow:hidden;
      scroll-snap-align:center;
    }
    .checkpoint::before{
      content:"";
      position:absolute;
      inset:0;
      width:calc(var(--p, 0) * 100%);
      background:rgba(110,231,255,.12);
      z-index:0;
    }
    .checkpoint > *{position:relative; z-index:1}
    .checkpoint:hover{border-color:rgba(255,255,255,.16)}
    .checkpoint.active{border-color:rgba(110,231,255,.55); box-shadow:0 0 0 2px rgba(110,231,255,.10) inset}

    .cp-line{
      display:flex;
      align-items:baseline;
      gap:6px;
      white-space:nowrap;
      overflow:hidden;
    }
    .cp-year, .cp-potus{
      font-size:11px;
      color:var(--muted);
      flex:0 0 auto;
    }
    .cp-sep{
      color:rgba(231,231,234,0.35);
      flex:0 0 auto;
    }
    .cp-title{
      font-size:12px;
      font-weight:620;
      flex:1 1 auto;
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .cp-detail{
      font-size:10.5px;
      margin-top:3px;
      color:var(--muted);
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }
    main{padding:8px 0 14px;}
    .grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
    }
    
    .yearReadout{
      margin:0;
      border:1px solid rgba(255,255,255,.06);
      background:rgba(0,0,0,.08);
      border-radius:12px;
      padding:6px;
      overflow:auto;
      width:fit-content;
      max-width:100%;
    }
    .yrTitle{
      font-size:11px;
      font-weight:650;
      color:var(--text);
      margin:0 0 6px;
      letter-spacing:.2px;
      white-space:nowrap;
    }
    .yrTitle span{ color:var(--accent); }

    table.yrTable{
      width:auto;
      border-collapse:collapse;
      min-width:0;
    }
    .yrTable thead th{
      color:rgba(231,231,234,0.9);
      font-size:10px;
      font-weight:650;
      padding:5px 6px;
      border-bottom:1px solid rgba(255,255,255,.08);
      text-align:right;
      white-space:nowrap;
    }
    .yrTable thead th:first-child{ text-align:left; }
    .yrTable tbody th{
      color:rgba(231,231,234,0.88);
      font-weight:650;
      font-size:10px;
      padding:5px 6px;
      border-bottom:1px solid rgba(255,255,255,.06);
      text-align:left;
      white-space:nowrap;
    }
    .yrTable tbody td{
      color:rgba(231,231,234,0.88);
      font-size:10px;
      font-variant-numeric: tabular-nums;
      padding:5px 6px;
      border-bottom:1px solid rgba(255,255,255,.06);
      text-align:right;
      white-space:nowrap;
    }
    .yrTable tbody tr:last-child th,
    .yrTable tbody tr:last-child td{ border-bottom:none; }

    .yearReadout.empty .yrTitle span{ color:rgba(231,231,234,0.6); }
@media (max-width: 900px){
      .grid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media (max-width: 640px){
      .grid{ grid-template-columns:1fr; }
    }
    .card{
      border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(180deg, rgba(18,20,28,.78), rgba(15,17,24,.72));
      border-radius:var(--radius);
      padding:8px;
    }
    .cardhead{
      display:flex; align-items:baseline; justify-content:space-between; gap:10px;
      margin-bottom:6px;
    }
    .cardheadLeft{display:flex; flex-direction:column; gap:2px; min-width:0;}
    .cardmeta{font-size:10.5px; color:rgba(231,231,234,0.78); margin:0; line-height:1.15;}

    .cardheadRight{display:flex; flex-direction:row; align-items:baseline; justify-content:flex-end; gap:10px;}
    .cardmetaRight{font-size:10.5px; color:rgba(231,231,234,0.78); margin:0; line-height:1.15; text-align:right; white-space:nowrap;}

    .cardtitle{font-size:12px; font-weight:650; color:var(--text); margin:0;}
    .cardsub{font-size:10.5px; color:var(--muted); margin:0; text-align:right;}
    .canvasbox{height:175px; position:relative;}
    footer{
      border-top:1px solid rgba(255,255,255,.06);
      color:var(--muted);
      font-size:12px;
      padding:10px 0 14px;
    }
    details{
      border:1px solid rgba(255,255,255,.08);
      border-radius:var(--radius);
      padding:10px 10px;
      background:rgba(18,20,28,.55);
    }
    summary{cursor:pointer; color:var(--text); font-weight:600}
    ul{margin:8px 0 0 18px; padding:0}
    li{margin:4px 0}
    a{color:var(--accent); text-decoration:none}
    a:hover{text-decoration:underline}
  
    /* Deep dives (newspaper-style) */
    .deepDives{
      margin-top:18px;
    }
    .deepDiveHead{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      padding:0 2px;
      margin-bottom:10px;
    }
    .deepDiveHead h2{
      margin:0;
      font-size:13px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:rgba(231,231,234,0.92);
    }
    .deepDiveSub{
      margin:0;
      font-size:11.5px;
      color:rgba(199,202,214,0.85);
    }
    .deepDiveList{
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .deepDiveItem{
      border:1px solid rgba(255,255,255,.08);
      background:rgba(18,20,28,.38);
      border-radius:var(--radius);
      padding:12px;
      display:grid;
      grid-template-columns:minmax(260px, 1.15fr) minmax(220px, 0.85fr);
      gap:14px;
      align-items:stretch;
      overflow:hidden;
    }
    .deepDiveItem:hover{ border-color:rgba(255,255,255,.14); }
    .deepDiveChart .canvasbox{ height:220px; }
    .deepDiveText{
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:8px;
      padding-right:2px;
    }
    .deepDiveKicker{
      font-size:11px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:rgba(199,202,214,0.88);
    }
    .deepDiveTitle{
      margin:0;
      font-size:15px;
      line-height:1.15;
      font-weight:740;
      color:rgba(231,231,234,0.96);
    }
    .deepDiveBody{
      margin:0;
      font-size:12px;
      line-height:1.55;
      color:rgba(199,202,214,0.92);
    }
    @media (max-width: 820px){
      .deepDiveItem{
        grid-template-columns:1fr;
      }
      .deepDiveChart .canvasbox{ height:210px; }
    }
</style>
</head>
<body>
<main>
  <div class="wrap">
    <div class="timeline-wrap" aria-label="timeline">
      <div class="timeline" id="timeline" aria-label="timeline checkpoints"></div>
    </div>
    <div class="readoutRow" aria-label="controls and readout">
      <div class="playDock" aria-label="play controls">
        <div class="transport" id="transport" aria-label="time controls">
          <button class="tbtn" id="tPrev" type="button" aria-label="Previous time step" title="Previous">⏮</button>
          <button class="tbtn" id="tPlay" type="button" aria-label="Play/Pause timeline" title="Play/Pause">⏵</button>
          <button class="tbtn" id="tNext" type="button" aria-label="Next time step" title="Next">⏭</button>
        </div>
      </div>

    <section class="yearReadout" id="yearReadout" aria-label="Year stats readout">
<table class="yrTable">
        <thead>
          <tr>
            <th scope="col"></th>
            <th scope="col">Budget</th>
            <th scope="col">Apprehensions</th>
            <th scope="col">Deportations</th>
            <th scope="col">Arrests</th>
            <th scope="col">Deaths</th>
            <th scope="col">Staffing</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">Cumulative</th>
            <td id="yr_budget_c">—</td>
            <td id="yr_apprehensions_c">—</td>
            <td id="yr_deportations_c">—</td>
            <td id="yr_arrests_c">—</td>
            <td id="yr_deaths_c">—</td>
            <td id="yr_staffing_c">—</td>
          </tr>
          <tr>
            <th scope="row" id="yr_year_label">—</th>
            <td id="yr_budget_y">—</td>
            <td id="yr_apprehensions_y">—</td>
            <td id="yr_deportations_y">—</td>
            <td id="yr_arrests_y">—</td>
            <td id="yr_deaths_y">—</td>
            <td id="yr_staffing_y">—</td>
          </tr>
        </tbody>
      </table>
    </section>
    </div>

    <div class="grid" id="chartsGrid"></div>

    <div class="deepDives" id="deepDives" aria-label="Deep dives by presidency">
      <div class="deepDiveHead">
        <h2>Deep dives by presidency</h2>
        <p class="deepDiveSub">Each panel zooms into one metric window around a presidential era (2 years before + 2 years after).</p>
      </div>
      <div class="deepDiveList" id="deepDiveList"></div>
    </div>

  </div>
</main>

<script>

function isMobileLike(){
  // Touch-first devices + narrow layouts
  return window.matchMedia("(max-width: 820px), (pointer: coarse)").matches;
}


function scrollToYear(year){
  const el = document.querySelector(`.checkpoint[data-year="${year}"]`);
  el?.scrollIntoView({ behavior:"smooth", inline:"center", block:"nearest" });
}

const PLAY_STEP_MS = 2500;
let playTimer = null;
let playRaf = null;
let playStepStart = 0;
let isPlaying = false;
let activeCheckpointEl = null;

function setActiveCheckpointEl(el){
  if(activeCheckpointEl && activeCheckpointEl !== el){
    activeCheckpointEl.style.setProperty("--p","0");
  }
  activeCheckpointEl = el;
  if(activeCheckpointEl){
    activeCheckpointEl.style.setProperty("--p","0");
  }
}

function startPlayProgress(){
  if(playRaf) return;
  const tick = (t)=>{
    if(!isPlaying){ playRaf = null; return; }
    if(activeCheckpointEl){
      const p = Math.max(0, Math.min(1, (t - playStepStart) / PLAY_STEP_MS));
      activeCheckpointEl.style.setProperty("--p", String(p));
    }
    playRaf = requestAnimationFrame(tick);
  };
  playRaf = requestAnimationFrame(tick);
}

function updatePlayButton(){
  const b = document.getElementById("tPlay");
  if(!b) return;
  b.textContent = isPlaying ? "⏸" : "⏵";
  const tr = document.getElementById("transport");
  if(tr) tr.classList.toggle("playing", isPlaying);
}

function setPlaying(on, opts = {}){
  const { keepProgress = true } = opts;
  const next = !!on;
  if(next === isPlaying) return;
  isPlaying = next;

  if(isPlaying){
    if(!checkpoints.length){
      isPlaying = false;
      updatePlayButton();
      return;
    }
    if(getFocusIndex() === -1) focusByIndex(0);
    if(activeCheckpointEl) activeCheckpointEl.style.setProperty("--p","0");
    playStepStart = performance.now();
    startPlayProgress();

    clearInterval(playTimer);
    playTimer = setInterval(()=>{
      if(!checkpoints.length) return;

      const idx = getFocusIndex();
      if(idx === -1){
        focusByIndex(0);
        if(activeCheckpointEl) activeCheckpointEl.style.setProperty("--p","0");
        playStepStart = performance.now();
        return;
      }

      if(idx >= checkpoints.length - 1){
        if(activeCheckpointEl) activeCheckpointEl.style.setProperty("--p","1");
        setPlaying(false, { keepProgress:true });
        return;
      }

      focusByIndex(idx + 1);
      if(activeCheckpointEl) activeCheckpointEl.style.setProperty("--p","0");
      playStepStart = performance.now();
    }, PLAY_STEP_MS);
  } else {
    clearInterval(playTimer);
    playTimer = null;
    if(!keepProgress && activeCheckpointEl) activeCheckpointEl.style.setProperty("--p","0");
  }

  updatePlayButton();
}

function togglePlay(){ setPlaying(!isPlaying); }

function clearFocus(){
  setPlaying(false);
  setActiveCheckpointEl(null);
  state.focusYear = null;
  document.querySelectorAll(".checkpoint").forEach(n=>{ n.classList.remove("active"); n.style.setProperty("--p","0"); });
  updateYearReadout();
  Object.values(state.charts).forEach(ch=>ch.update());
}

function setFocusYear(year, opts = {}){
  const { toggle = true, scroll = true } = opts;

  if(toggle && year === state.focusYear) year = null;

  state.focusYear = (year==null ? null : Number(year));

  document.querySelectorAll(".checkpoint").forEach(n=>{
    const isA = state.focusYear!==null && Number(n.dataset.year)===state.focusYear;
    n.classList.toggle("active", isA);
    if(!isA) n.style.setProperty("--p","0");
  });

  const active = (state.focusYear==null) ? null : document.querySelector(`.checkpoint[data-year="${state.focusYear}"]`);
  setActiveCheckpointEl(active);

  if(scroll && state.focusYear != null) scrollToYear(state.focusYear);

  updateYearReadout();
  Object.values(state.charts).forEach(ch=>ch.update());
}

function getFocusIndex(){
  if(state.focusYear == null) return -1;
  return checkpoints.findIndex(cp => Number(cp.year) === Number(state.focusYear));
}

function focusByIndex(i, opts = {}){
  if(!checkpoints.length) return;
  const clamped = Math.max(0, Math.min(checkpoints.length - 1, i));
  const defaultScroll = (opts && opts.scroll === undefined) ? (!isPlaying) : opts.scroll;
  setFocusYear(checkpoints[clamped].year, { toggle:false, ...opts, scroll: defaultScroll });
}

function step(delta){
  if(!checkpoints.length) return;
  const idx = getFocusIndex();
  if(idx === -1){
    focusByIndex(delta > 0 ? 0 : checkpoints.length - 1);
    return;
  }
  focusByIndex(idx + delta);
}

function setupTransport(){
  const prev = document.getElementById("tPrev");
  const next = document.getElementById("tNext");
  const play = document.getElementById("tPlay");
  prev?.addEventListener("click", ()=>{ setPlaying(false); step(-1); });
  next?.addEventListener("click", ()=>{ setPlaying(false); step(1); });
  play?.addEventListener("click", ()=>{ togglePlay(); });
  updatePlayButton();
}

function setupKeyboard(){
  window.addEventListener("keydown", (e)=>{
    const t = e.target;
    const tag = (t?.tagName || "").toLowerCase();
    if(tag === "input" || tag === "textarea" || t?.isContentEditable) return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;

    if(e.key === "ArrowRight"){ e.preventDefault(); setPlaying(false); step(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); setPlaying(false); step(-1); }
    else if(e.key === "Home"){ e.preventDefault(); setPlaying(false); focusByIndex(0); }
    else if(e.key === "End"){ e.preventDefault(); setPlaying(false); focusByIndex(checkpoints.length - 1); }
    else if(e.key === "Escape"){ e.preventDefault(); clearFocus(); }
    else if(e.key === " "){ e.preventDefault(); togglePlay(); }
  });
}

const focusLinePlugin = {
  id: 'focusLine',
  afterDatasetsDraw(chart) {
    const year = state.focusYear;
    if(year == null) return;

    const xScale = chart.scales.x;
    const yScale = chart.scales.y;
    const labels = (chart.data && chart.data.labels) ? chart.data.labels : [];
    if(!labels || !labels.length) return;

    const yearStr = String(year);
    let x = null;

    const idx = labels.indexOf(yearStr);
    if(idx !== -1){
      x = xScale.getPixelForValue(idx);
    } else {
      const years = labels.map(v => Number(v));
      const n = years.length;

      const firstCenter = xScale.getPixelForValue(0);
      const lastCenter  = xScale.getPixelForValue(n - 1);

      let step = (n > 1) ? (xScale.getPixelForValue(1) - firstCenter) : (xScale.right - xScale.left);
      if(!isFinite(step) || step === 0) step = (xScale.right - xScale.left) / Math.max(1, n);

      const leftEdge  = firstCenter - step / 2;
      const rightEdge = lastCenter  + step / 2;

      let i = 0;
      while(i < n && years[i] < year) i++;

      if(i <= 0) x = leftEdge;
      else if(i >= n) x = rightEdge;
      else {
        const y0 = years[i - 1], y1 = years[i];
        const x0 = xScale.getPixelForValue(i - 1);
        const x1 = xScale.getPixelForValue(i);
        const t = (y1 === y0) ? 0 : (year - y0) / (y1 - y0);
        x = x0 + (x1 - x0) * t;
      }
    }

    if(x == null) return;
    x = Math.max(xScale.left, Math.min(xScale.right, x));

    const ctx = chart.ctx;
    ctx.save();
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(110,231,255,0.55)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4,4]);
    ctx.moveTo(x, yScale.top);
    ctx.lineTo(x, yScale.bottom);
    ctx.stroke();
    ctx.restore();
  }
};

Chart.register(focusLinePlugin);

const POTUS_BANDS = [
  // Era bands intentionally align to election-era labels used across the page:
  // 2008 -> Obama, 2016 -> Trump, 2024 -> Trump
  { potus:"Bush",  start:2001, end:2007, band:"rgba(255,193,7,0.14)",  swatch:"rgba(255,193,7,0.72)" },
  { potus:"Obama", start:2008, end:2015, band:"rgba(33,150,243,0.14)", swatch:"rgba(33,150,243,0.72)" },
  { potus:"Trump", start:2016, end:2019, band:"rgba(244,67,54,0.12)",  swatch:"rgba(244,67,54,0.68)" },
  { potus:"Biden", start:2020, end:2023, band:"rgba(76,175,80,0.12)",  swatch:"rgba(76,175,80,0.68)" },
  { potus:"Trump", start:2024, end:2025, band:"rgba(244,67,54,0.12)",  swatch:"rgba(244,67,54,0.68)" }
];

function mergedPotusBands(){
  const bands = [...POTUS_BANDS].sort((a,b)=>a.start-b.start);
  const out = [];
  for(const b of bands){
    const last = out[out.length-1];
    if(last && last.potus === b.potus && b.start <= (last.end + 1)){
      last.end = Math.max(last.end, b.end);
    } else {
      out.push({ potus:b.potus, start:b.start, end:b.end });
    }
  }
  return out;
}

function potusTickMap(yearLabels){
  const years = yearLabels.map(v=>Number(v));
  const map = Object.create(null);
  for(const band of mergedPotusBands()){
    let first=-1,last=-1;
    for(let i=0;i<years.length;i++){
      const y = years[i];
      if(Number.isFinite(y) && y>=band.start && y<=band.end){
        if(first===-1) first=i;
        last=i;
      }
    }
    if(first===-1) continue;
    const mid = Math.round((first+last)/2);
    map[mid] = band.potus;
  }
  return map;
}

function buildPOTUSLegend(){
  const el = document.getElementById("potusLegend");
  if(!el) return;
  const seen = new Set();
  el.innerHTML = "";

    if(seen.has(b.potus)) return;
    seen.add(b.potus);

    lab.textContent = b.potus;
    item.appendChild(sw);
    item.appendChild(lab);
    el.appendChild(item);
  });
}

const potusBandPlugin = {
  id: 'potusBands',
  beforeDraw(chart) {
    const labels = chart?.data?.labels || [];
    if(!labels.length) return;
    const xScale = chart.scales?.x;
    const chartArea = chart.chartArea;
    if(!xScale || !chartArea) return;

    const centers = labels.map((_,i)=>xScale.getPixelForValue(i));
    if(!centers.length) return;
    const step = (centers.length > 1) ? (centers[1] - centers[0]) : (chartArea.right - chartArea.left);

    const years = labels.map(v=>Number(v));
    const ctx = chart.ctx;
    ctx.save();

    POTUS_BANDS.forEach(b=>{
      let first = -1, last = -1;
      for(let i=0;i<years.length;i++){
        const y = years[i];
        if(Number.isFinite(y) && y >= b.start && y <= b.end){
          if(first === -1) first = i;
          last = i;
        }
      }
      if(first === -1) return;

      let left = centers[first] - step/2;
      let right = centers[last] + step/2;

      left = Math.max(left, chartArea.left);
      right = Math.min(right, chartArea.right);

      ctx.fillStyle = b.band;
      ctx.fillRect(left, chartArea.top, right - left, chartArea.bottom - chartArea.top);
    });

    ctx.restore();
  }
};
Chart.register(potusBandPlugin);

function cumulativeSeries(arr){
  let c = 0;
  return arr.map(v=>{
    if(v==null || v==="" || Number.isNaN(Number(v))) return null;
    c += Number(v);
    return c;
  });
}

function lastNonNull(arr){
  for(let i=arr.length-1;i>=0;i--){
    const v = arr[i];
    if(v==null || v==="" || Number.isNaN(Number(v))) continue;
    return Number(v);
  }
  return null;
}

function meanNonNull(arr){
  let s = 0, n = 0;
  for(const v of arr){
    if(v==null || v==="" || Number.isNaN(Number(v))) continue;
    s += Number(v);
    n++;
  }
  return n ? (s / n) : null;
}

function formatHuman(v, opts={}){
  const isMoney = !!opts.isMoney;
  if(v==null || v==="" || !isFinite(Number(v))) return "—";
  const num = Number(v);
  const sign = num < 0 ? "-" : "";
  const abs  = Math.abs(num);
  const prefix = isMoney ? "$" : "";

  const unit = (factor, label) => {
    const scaled = abs / factor;
    const decimals = scaled < 10 ? 1 : 0;
    return `${sign}${prefix}${scaled.toFixed(decimals)} ${label}`;
  };

  if(abs >= 1e12) return unit(1e12, "Trillion");
  if(abs >= 1e9)  return unit(1e9, "Billion");
  if(abs >= 1e6)  return unit(1e6, "Million");
  if(abs >= 1e3)  return `${sign}${prefix}${Math.round(abs/1e3)}K`;

  const rounded = Math.round(abs);
  return `${sign}${prefix}${Intl.NumberFormat("en-US").format(rounded)}`;
}

function _metricByKey(key){
  return metrics.find(m => m.key === key) || null;
}

function _fmtCell(key, v){
  if(v==null || v==="" || !isFinite(Number(v))) return "—";
  const m = _metricByKey(key);
  if(m && typeof m.format === "function"){
    const out = m.format(Number(v));
    return (out==="" ? "—" : out);
  }
  return Intl.NumberFormat("en-US").format(Number(v));
}

function estimateNewHiresFromFTE(fteArr){
  const out = new Array(fteArr.length).fill(null);

  // Treat the first recorded staffing level as the initial stand-up hiring (baseline year).
  const first = fteArr[0];
  if(first != null && first !== "" && !Number.isNaN(Number(first))) out[0] = Number(first);

  for(let i=1;i<fteArr.length;i++){
    const prev = fteArr[i-1];
    const cur  = fteArr[i];
    if(prev==null || cur==null || prev==="" || cur==="") { out[i] = null; continue; }
    const d = Number(cur) - Number(prev);
    out[i] = d > 0 ? d : 0;
  }
  return out;
}

function getNewHiresSeries(){
  const candidates = ["new_hires","fte_new_hires","staff_new_hires","hires"];
  const series = embeddedData.map(r=>{
    if(!r) return null;
    for(const k of candidates){
      if(r[k] !== undefined && r[k] !== null) return r[k];
    }
    return null;
  });
  const hasAny = series.some(v=>v!==null && v!==undefined);
  if(hasAny) return series;
  // fallback: minimum plausible estimate from FTE increases
  const fte = embeddedData.map(r => (r && r.fte !== undefined ? r.fte : null));

  // NOTE: This dataset includes a placeholder FY2002 row used for initial budget/staffing display.
  // Charts begin at FY2003, and FY2003 should represent the "stand-up" hiring.
  // Treat FY2003 as the baseline year for new hires, not FY2002.
  const est = estimateNewHiresFromFTE(fte);
  const idx2003 = embeddedData.findIndex(r => r && Number(r.year) === 2003);
  if(idx2003 !== -1){
    // Hard-code FY2003 new hires to 15,000 per user request.
    est[idx2003] = 15000;
    // Avoid implying hiring in the FY2002 placeholder row.
    for(let i=0;i<idx2003;i++) est[i] = null;
  }
  return est;
}


function sumFromKeys(row, keys){
  let sum = 0;
  let has = false;
  for(const k of keys){
    const v = row[k];
    if(v==null || v==="") continue;
    const num = Number(v);
    if(Number.isNaN(num)) continue;
    sum += num;
    has = true;
  }
  return has ? sum : null;
}

function buildCharts(){
  const grid = document.getElementById("chartsGrid");
  grid.innerHTML = "";
  const years = embeddedData.map(r=>String(r.year));
  // Keep 2002 in the timeline + readout, but start charts at 2003 so selecting 2002 draws the focus line
  // at the very left edge (and 2002 doesn't render as a data point).
  const CHART_START_YEAR = 2003;
  const chartStartIdx = embeddedData.findIndex(r => Number(r.year) >= CHART_START_YEAR);
  const chartStart = (chartStartIdx === -1) ? 0 : chartStartIdx;
  const chartYears = years.slice(chartStart);

  metrics.forEach(m=>{
    const raw = embeddedData.map(r => {
    if(!r) return null;
    if(Array.isArray(m.sourceKeys) && m.sourceKeys.length){
      return sumFromKeys(r, m.sourceKeys);
    }
    return (r[m.key] === undefined ? null : r[m.key]);
  });
    const perYear = (m.key === "fte") ? getNewHiresSeries() : raw;
    const cumulative = (m.key === "fte") ? raw : cumulativeSeries(raw);
    state.series[m.key] = { perYear, cumulative };

    const yearlyAvg = meanNonNull(perYear);
    const totalVal  = lastNonNull(cumulative);
    const isMoney = (m.key === "budget_nominal_usd");
    const yearlyTxt = formatHuman(yearlyAvg, { isMoney });
    const totalTxt  = formatHuman(totalVal,  { isMoney });

    const card = document.createElement("section");

function rgbaWithAlpha(rgba, alpha){
  const m = String(rgba).match(/rgba\((\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*([0-9.]+)\)/i);
  if(!m) return rgba;
  return `rgba(${m[1]},${m[2]},${m[3]},${alpha})`;
}

function potusSwatchForYear(year, alpha=0.55){
  const y = Number(year);
  const b = POTUS_BANDS.find(bb => y >= bb.start && y <= bb.end);
  if(!b) return "rgba(110,231,255,0.35)";
  return rgbaWithAlpha(b.swatch, alpha);
}
